[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hexroute"
version = "0.1.0"
description = "Hex Route Optimiser for Strava Territory Competition"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hexroute Team" }
]
dependencies = [
    "h3>=4.1.0",
    "osmnx>=1.9.0",
    "networkx>=3.0",
    "gpxpy>=1.6.0",
    "fitparse>=1.2.0",
    "shapely>=2.0.0",
    "folium>=0.16.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
hexroute = "hexroute.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
